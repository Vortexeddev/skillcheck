<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>skillcheck — how it works</title>

  <!-- card background, so it reads as an intentional panel in light and dark GitHub -->
  <rect x="0" y="0" width="960" height="640" rx="16" fill="#16181E"/>

  <!-- ============================== node 1 ============================== -->
  <rect x="240" y="24" width="480" height="56" rx="10" fill="#20242D" stroke="#333947" stroke-width="1.5"/>
  <circle cx="268" cy="52" r="6" fill="#FF5F56"/>
  <circle cx="288" cy="52" r="6" fill="#FFBD2E"/>
  <circle cx="308" cy="52" r="6" fill="#27C93F"/>
  <text x="336" y="58" font-size="17" fill="#D6DBE5">You find a skill repo on GitHub</text>

  <line x1="480" y1="80" x2="480" y2="108" stroke="#4A5262" stroke-width="2"/>
  <polygon points="480,118 472,104 488,104" fill="#4A5262"/>

  <!-- ============================== node 2 ============================== -->
  <rect x="200" y="118" width="560" height="56" rx="10" fill="#20242D" stroke="#56B6DB" stroke-width="1.5"/>
  <text x="228" y="152" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#56B6DB">$ npx skillcheck check owner/repo</text>

  <line x1="480" y1="174" x2="480" y2="202" stroke="#4A5262" stroke-width="2"/>
  <polygon points="480,212 472,198 488,198" fill="#4A5262"/>

  <!-- ============================== node 3 ============================== -->
  <rect x="120" y="212" width="720" height="96" rx="10" fill="#20242D" stroke="#333947" stroke-width="1.5"/>
  <text x="480" y="244" font-size="16" fill="#D6DBE5" text-anchor="middle">skillcheck asks GitHub 7 free API calls — no account, no key</text>

  <rect x="180" y="260" width="180" height="34" rx="17" fill="#1B2733" stroke="#56B6DB" stroke-width="1"/>
  <text x="270" y="282" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#56B6DB" text-anchor="middle">LICENSE?</text>

  <rect x="390" y="260" width="180" height="34" rx="17" fill="#1B2733" stroke="#56B6DB" stroke-width="1"/>
  <text x="480" y="282" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#56B6DB" text-anchor="middle">SPEC?</text>

  <rect x="600" y="260" width="180" height="34" rx="17" fill="#1B2733" stroke="#56B6DB" stroke-width="1"/>
  <text x="690" y="282" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#56B6DB" text-anchor="middle">HEALTH?</text>

  <!-- branching arrows -->
  <line x1="480" y1="308" x2="480" y2="330" stroke="#4A5262" stroke-width="2"/>
  <line x1="160" y1="330" x2="800" y2="330" stroke="#4A5262" stroke-width="2"/>
  <line x1="160" y1="330" x2="160" y2="356" stroke="#4A5262" stroke-width="2"/>
  <line x1="480" y1="330" x2="480" y2="356" stroke="#4A5262" stroke-width="2"/>
  <line x1="800" y1="330" x2="800" y2="356" stroke="#4A5262" stroke-width="2"/>
  <polygon points="160,366 152,352 168,352" fill="#4A5262"/>
  <polygon points="480,366 472,352 488,352" fill="#4A5262"/>
  <polygon points="800,366 792,352 808,352" fill="#4A5262"/>

  <!-- ============================ verdict boxes ========================== -->
  <rect x="50" y="366" width="220" height="120" rx="10" fill="#12241B" stroke="#56D184" stroke-width="1.5"/>
  <circle cx="105" cy="394" r="6" fill="#56D184"/><text x="170" y="400" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#56D184" text-anchor="middle">SAFE TO SHIP</text>
  <text x="160" y="424" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8A94A6" text-anchor="middle">exit 0</text>
  <text x="160" y="452" font-size="13" fill="#AEB6C4" text-anchor="middle">install it, ship with it</text>

  <rect x="370" y="366" width="220" height="120" rx="10" fill="#2A2314" stroke="#E5C07B" stroke-width="1.5"/>
  <circle cx="420" cy="394" r="6" fill="#E5C07B"/><text x="490" y="400" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#E5C07B" text-anchor="middle">NEEDS REVIEW</text>
  <text x="480" y="424" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8A94A6" text-anchor="middle">exit 1</text>
  <text x="480" y="452" font-size="13" fill="#AEB6C4" text-anchor="middle">a human reads the license</text>

  <rect x="690" y="366" width="220" height="120" rx="10" fill="#2A1518" stroke="#F0626A" stroke-width="1.5"/>
  <circle cx="745" cy="394" r="6" fill="#F0626A"/><text x="810" y="400" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#F0626A" text-anchor="middle">DO NOT SHIP</text>
  <text x="800" y="424" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8A94A6" text-anchor="middle">exit 2</text>
  <text x="800" y="452" font-size="13" fill="#AEB6C4" text-anchor="middle">all rights reserved by default</text>

  <!-- converge -->
  <line x1="160" y1="486" x2="160" y2="510" stroke="#4A5262" stroke-width="2"/>
  <line x1="800" y1="486" x2="800" y2="510" stroke="#4A5262" stroke-width="2"/>
  <line x1="480" y1="486" x2="480" y2="510" stroke="#4A5262" stroke-width="2"/>
  <line x1="160" y1="510" x2="800" y2="510" stroke="#4A5262" stroke-width="2"/>
  <line x1="480" y1="510" x2="480" y2="536" stroke="#4A5262" stroke-width="2"/>
  <polygon points="480,546 472,532 488,532" fill="#4A5262"/>

  <!-- ============================== node 5 ============================== -->
  <rect x="200" y="546" width="560" height="56" rx="10" fill="#20242D" stroke="#333947" stroke-width="1.5"/>
  <text x="480" y="580" font-size="16" fill="#D6DBE5" text-anchor="middle">Your agent installs only what the law and the spec allow.</text>
</svg>
